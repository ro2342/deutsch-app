<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Deutsch A1.1</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/navigation.css">

</head>
<body>

    <div class="max-w-3xl mx-auto px-4">
        
        <div id="page-loader" class="fixed inset-0 z-[9999] flex items-center justify-center" style="background: var(--bg);">
            <div class="text-center">
                <svg class="animate-spin h-10 w-10 mx-auto mb-4" style="color: var(--primary);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="font-medium text-lg">Carregando seu progresso...</p>
            </div>
        </div>
        
        <div id="page-home"></div>
        <div id="page-map" class="hidden"></div>
        <div id="page-progress" class="hidden"></div>
        <div id="page-review" class="hidden"></div>
        <div id="page-settings" class="hidden"></div>
        <div id="page-exercise" class="hidden pt-8"></div>

        <div id="page-lessons" class="hidden"></div>
        <div id="page-trainer" class="hidden"></div>
        
        <div id="page-settings-theme" class="hidden"></div>
        <div id="page-settings-profile" class="hidden"></div>
        
    </div>
    
    <div id="modal-container" class="fixed inset-0 z-[5000] flex items-center justify-center p-4 hidden">
        <div id="modal-content">
            </div>
    </div>
    
    <nav class="liquid-nav-container">
        <div class="liquid-nav">
            <div id="nav-liquid-pill" class="liquid-pill"></div>
            <a href="#/home" class="nav-link" data-link-id="home">
                <ion-icon name="home-outline" class="w-5 h-5"></ion-icon>
                <span>Início</span>
            </a>
            <a href="#/map" class="nav-link" data-link-id="map">
                <ion-icon name="map-outline" class="w-5 h-5"></ion-icon>
                <span>Mapa</span>
            </a>
            <a href="#/review" class="nav-link" data-link-id="review">
                <ion-icon name="heart-dislike-outline" class="w-5 h-5"></ion-icon>
                <span>Revisão</span>
            </a>
            <a href="#/progress" class="nav-link" data-link-id="progress">
                <ion-icon name="stats-chart-outline" class="w-5 h-5"></ion-icon>
                <span>Progresso</span>
            </a>
            <a href="#/settings" class="nav-link" data-link-id="settings">
                <ion-icon name="cog-outline" class="w-5 h-5"></ion-icon>
                <span>Ajustes</span>
            </a>
        </div>
    </nav>
    
    <script src="themes.js"></script>
<script src="grammarExplanations.js"></script>
    <script src="exercisesData.js"></script>
    <script src="data/articleData.js"></script> 
    
    <script type="module" src="main.js"></script> 
</body>
</html>
